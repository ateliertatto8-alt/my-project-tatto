<!-- 4. จองคิว (Booking Form) -->
<section id="booking" class="py-20 bg-zinc-900 border-t border-zinc-800">
    <div class="max-w-3xl mx-auto px-4">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-white mb-2">ฟอร์มจองคิว</h2>
            <p class="text-zinc-400">กรอกข้อมูลเบื้องต้นเพื่อส่งคำขอจองคิว ระบบจะส่งข้อมูลตรงเข้า LINE ของร้านทันที</p>
        </div>
        
        <form id="bookingForm" class="bg-zinc-950 p-6 md:p-8 rounded-2xl border border-zinc-800 space-y-6">
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium mb-2 text-zinc-300">วันที่ต้องการจอง *</label>
                    <input type="date" id="bookingDate" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-zinc-300">เวลาที่ต้องการ *</label>
                    <input type="time" id="bookingTime" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium mb-2 text-zinc-300">ชื่อผู้ติดต่อ *</label>
                    <input type="text" id="customerName" placeholder="คุณสมชาย" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-zinc-300">เบอร์โทรศัพท์ / LINE ID *</label>
                    <input type="text" id="contactInfo" placeholder="08X-XXX-XXXX หรือ Line ID" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-2 text-zinc-300">รายละเอียดลายสัก / ตำแหน่งที่ต้องการสัก</label>
                <textarea id="tattooDetail" rows="4" placeholder="ระบุ เช่น สักลายตัวอักษรบริเวณข้อแขน ขนาดประมาณ 5 ซม." class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-amber-500"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold py-4 rounded-lg shadow-lg transition duration-200">
                ส่งคำขอจองคิวเข้า LINE ร้าน
            </button>
            <p class="text-xs text-center text-zinc-500">* หมายเหตุ: การส่งคำขอจองคิวเป็นการแจ้งประสงค์จองคิวเบื้องต้น ทางร้านจะติดต่อกลับเพื่อยืนยันคิวและมัดจำอีกครั้ง</p>
        </form>
    </div>
</section>

<script>
    // *** นำ URL Webhook จาก Make.com หรือบริการส่ง LINE มาวางที่นี่ ***
    const WEBHOOK_URL = "https://hook.eu1.make.com/YOUR_WEBHOOK_ID_HERE"; 
    
    // *** ลิงก์ LINE OA ของร้าน (สำรองกรณีต้องการให้เด้งเข้าแชต LINE) ***
    const LINE_OA_URL = "https://line.me/ti/p/@YOUR_LINE_ID"; 

    document.getElementById("bookingForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const submitBtn = document.getElementById("submitBtn");
        submitBtn.innerText = "กำลังส่งข้อมูล...";
        submitBtn.disabled = true;

        const formData = {
            date: document.getElementById("bookingDate").value,
            time: document.getElementById("bookingTime").value,
            name: document.getElementById("customerName").value,
            contact: document.getElementById("contactInfo").value,
            detail: document.getElementById("tattooDetail").value || "ไม่ได้ระบุ"
        };

        try {
            // ส่งข้อมูลไปยัง Webhook (เพื่อเข้า LINE)
            if (WEBHOOK_URL && !WEBHOOK_URL.includes("YOUR_WEBHOOK_ID_HERE")) {
                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData)
                });
                alert("ส่งคำขอจองคิวเข้า LINE ร้านเรียบร้อยแล้วครับ! ทางร้านจะรีบติดต่อกลับโดยเร็วที่สุด");
            } else {
                // กรณีที่ยังไม่ได้ตั้งค่า Webhook ระบบจะจัดข้อความแล้วเปิด LINE ให้ส่งหาแชตร้านโดยตรง
                const textMessage = `📌 *รายการจองคิวใหม่ (71's Atelier Tattoo)*\n\n👤 ชื่อ: ${formData.name}\n📅 วันที่: ${formData.date}\n⏰ เวลา: ${formData.time}\n📞 ติดต่อ: ${formData.contact}\n🎨 รายละเอียด: ${formData.detail}`;
                const encodedMessage = encodeURIComponent(textMessage);
                
                alert("กำลังนำคุณไปยัง LINE ของทางร้านเพื่อส่งข้อมูลการจอง...");
                window.location.href = `${LINE_OA_URL}?text=${encodedMessage}`;
            }

            document.getElementById("bookingForm").reset();
        } catch (error) {
            alert("เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง หรือติดต่อทางร้านโดยตรง");
            console.error(error);
        } finally {
            submitBtn.innerText = "ส่งคำขอจองคิวเข้า LINE ร้าน";
            submitBtn.disabled = false;
        }
    });
</script>
